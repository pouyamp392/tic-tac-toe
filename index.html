<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>doz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');

        * {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
        .active-turn {
            animation: pulse 1s infinite;
        }

        @keyframes modalPop {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .custom-modal-content {
            animation: modalPop 0.25s ease;
        }

        .doz-child.x::before,
        .doz-child.x::after {
            content: '';
            position: absolute;
            width: 4px;
            height: 0;
            top: 50%;
            left: 50%;
            background: #ff4b4b;
            transform-origin: center;
            transition: height 0.3s ease;
        }
        .doz-child.x::before {
            transform: translate(-50%, -50%) rotate(45deg);
        }
        .doz-child.x::after {
            transform: translate(-50%, -50%) rotate(-45deg);
        }
        .doz-child.x.active::before,
        .doz-child.x.active::after {
            height: 60%;
        }

        .doz-child.o::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border: 4px solid #4b7bff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.3s ease, height 0.3s ease;
        }
        .doz-child.o.active::before {
            width: 60%;
            height: 60%;
        }

        .red-test {
            background: radial-gradient(circle, #ff4b4b, #b30000);
            box-shadow: 0 0 20px #ff4b4b;
        }
        .blue-test {
            background: radial-gradient(circle, #4b7bff, #0026b3);
            box-shadow: 0 0 20px #4b7bff;
        }
        .doz-child:hover {
            border-color: cyan;
            box-shadow: 0 0 15px cyan;
        }

        .end.open-modal {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }
        .custom-modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .opt-btn.opt-selected {
            border-color: #00ff88;
            color: #00ff88;
            box-shadow: 0 0 10px #00ff88;
        }

        .doz-body {
            width: min(420px, 55vw, 70vh);
            height: min(420px, 55vw, 70vh);
        }
        .side-box {
            width: clamp(40px, 9vw, 120px);
            height: clamp(40px, 9vw, 120px);
        }

        @media (max-width: 380px) {
            .doz-body {
                width: min(85vw, 60vh);
                height: min(85vw, 60vh);
            }
            .side-box {
                width: 35px;
                height: 35px;
            }
        }

        @media (max-height: 600px) {
            .doz-body {
                width: min(55vw, 65vh);
                height: min(55vw, 65vh);
            }
        }
    </style>
</head>

<body class="m-0 p-0 min-h-[100dvh] flex justify-center items-center bg-[radial-gradient(circle_at_top,_#1f1f1f,_#0d0d0d)] overflow-x-hidden">
    <div class="flex flex-col items-center gap-3 sm:gap-4 md:gap-5 py-3 sm:py-4 md:py-6 w-full">

        <div class="flex gap-4 sm:gap-6 md:gap-8 px-4 sm:px-5 md:px-6 py-2 sm:py-3 bg-white/[0.06] rounded-[15px] backdrop-blur-[12px] border border-white/[0.12] shadow-[0_0_20px_rgba(0,255,255,0.15)]">
            <div class="flex items-center gap-1.5 sm:gap-2 text-red-500 text-sm sm:text-base">
                <span>RED :</span>
                <h2 class="score-red m-0 text-lg sm:text-xl md:text-2xl"></h2>
            </div>
            <div class="flex items-center gap-1.5 sm:gap-2 text-blue-500 text-sm sm:text-base">
                <span>BLUE :</span>
                <h2 class="score-blue m-0 text-lg sm:text-xl md:text-2xl"></h2>
            </div>
        </div>

        <button class="btn-restart-score px-4 sm:px-5 md:px-6 py-2 sm:py-2.5 bg-transparent border-2 border-[#ff4444] text-[#ff4444] rounded-xl text-sm sm:text-base cursor-pointer transition-all duration-200 hover:bg-[#ff4444] hover:text-black hover:shadow-[0_0_15px_#ff4444]">
            ریست امتیاز ها
        </button>

        <div class="flex items-center justify-center gap-2 sm:gap-4 md:gap-8 lg:gap-12 w-full px-2 sm:px-4">
            <div class="red-test side-box rounded-[15px] sm:rounded-[18px] md:rounded-[20px] border-2 border-white/[0.12] cursor-pointer transition-all duration-300 shrink-0"></div>

            <div class="doz-body grid grid-cols-3 gap-1.5 sm:gap-2 md:gap-3 p-2.5 sm:p-3.5 md:p-5 rounded-[18px] sm:rounded-[22px] md:rounded-[25px] bg-white/5 border border-white/[0.12] backdrop-blur-[10px] shadow-[0_0_25px_rgba(0,255,255,0.15)] shrink-0">
                <div class="doz-child relative rounded-[12px] sm:rounded-[16px] md:rounded-[20px] bg-white/[0.07] border-2 border-white/[0.12] cursor-pointer transition-all duration-200 hover:scale-[1.07]" id="0"></div>
                <div class="doz-child relative rounded-[12px] sm:rounded-[16px] md:rounded-[20px] bg-white/[0.07] border-2 border-white/[0.12] cursor-pointer transition-all duration-200 hover:scale-[1.07]" id="1"></div>
                <div class="doz-child relative rounded-[12px] sm:rounded-[16px] md:rounded-[20px] bg-white/[0.07] border-2 border-white/[0.12] cursor-pointer transition-all duration-200 hover:scale-[1.07]" id="2"></div>
                <div class="doz-child relative rounded-[12px] sm:rounded-[16px] md:rounded-[20px] bg-white/[0.07] border-2 border-white/[0.12] cursor-pointer transition-all duration-200 hover:scale-[1.07]" id="3"></div>
                <div class="doz-child relative rounded-[12px] sm:rounded-[16px] md:rounded-[20px] bg-white/[0.07] border-2 border-white/[0.12] cursor-pointer transition-all duration-200 hover:scale-[1.07]" id="4"></div>
                <div class="doz-child relative rounded-[12px] sm:rounded-[16px] md:rounded-[20px] bg-white/[0.07] border-2 border-white/[0.12] cursor-pointer transition-all duration-200 hover:scale-[1.07]" id="5"></div>
                <div class="doz-child relative rounded-[12px] sm:rounded-[16px] md:rounded-[20px] bg-white/[0.07] border-2 border-white/[0.12] cursor-pointer transition-all duration-200 hover:scale-[1.07]" id="6"></div>
                <div class="doz-child relative rounded-[12px] sm:rounded-[16px] md:rounded-[20px] bg-white/[0.07] border-2 border-white/[0.12] cursor-pointer transition-all duration-200 hover:scale-[1.07]" id="7"></div>
                <div class="doz-child relative rounded-[12px] sm:rounded-[16px] md:rounded-[20px] bg-white/[0.07] border-2 border-white/[0.12] cursor-pointer transition-all duration-200 hover:scale-[1.07]" id="8"></div>
            </div>

            <div class="blue-test side-box rounded-[15px] sm:rounded-[18px] md:rounded-[20px] border-2 border-white/[0.12] cursor-pointer transition-all duration-300 shrink-0"></div>
        </div>

        <div class="end absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 scale-[0.8] bg-black/75 px-5 py-5 sm:px-8 sm:py-7 md:px-11 md:py-9 rounded-[20px] backdrop-blur-[12px] border border-white/[0.15] text-center opacity-0 pointer-events-none transition-all duration-300 w-[min(340px,92vw)]">
            <h1 id="h1-winner" class="mb-4 text-2xl sm:text-3xl md:text-[2rem]"></h1>

            <p class="text-white/70 text-xs sm:text-sm mb-2">حالت بازی</p>
            <div class="flex justify-center gap-2 sm:gap-3 mb-4">
                <button id="mode-bot" class="opt-btn bg-transparent px-3 sm:px-5 py-1.5 sm:py-2 rounded-lg sm:rounded-xl border-2 border-white/20 text-white/70 text-xs sm:text-sm transition-all duration-200 cursor-pointer">با ربات</button>
                <button id="mode-two" class="opt-btn bg-transparent px-3 sm:px-5 py-1.5 sm:py-2 rounded-lg sm:rounded-xl border-2 border-white/20 text-white/70 text-xs sm:text-sm transition-all duration-200 cursor-pointer">دونفره</button>
            </div>

            <p class="text-white/70 text-xs sm:text-sm mb-2">رنگ شما</p>
            <div class="flex justify-center gap-2 sm:gap-3 mb-5 sm:mb-6">
                <button id="color-red" class="opt-btn bg-transparent px-3 sm:px-5 py-1.5 sm:py-2 rounded-lg sm:rounded-xl border-2 border-white/20 text-white/70 text-xs sm:text-sm transition-all duration-200 cursor-pointer">قرمز</button>
                <button id="color-blue" class="opt-btn bg-transparent px-3 sm:px-5 py-1.5 sm:py-2 rounded-lg sm:rounded-xl border-2 border-white/20 text-white/70 text-xs sm:text-sm transition-all duration-200 cursor-pointer">آبی</button>
            </div>

            <button class="restart-btn px-6 sm:px-9 py-2.5 sm:py-3 text-base sm:text-xl font-semibold text-[#00ff88] bg-white/5 border-2 border-[#00ff88]/40 rounded-[15px] cursor-pointer backdrop-blur-[10px] transition-all duration-200 tracking-wider shadow-[0_0_10px_rgba(0,255,136,0.2)] hover:text-black hover:bg-[#00ff88] hover:shadow-[0_0_20px_#00ff88,_0_0_40px_#00ff88] hover:-translate-y-[3px] active:scale-95" id="start-game-btn"><span>شروع بازی</span></button>
        </div>
    </div>

    <div class="custom-modal fixed inset-0 bg-black/65 flex justify-center items-center opacity-0 pointer-events-none transition-all duration-200 ease-in-out z-[9999]" id="reset-modal">
        <div class="custom-modal-content bg-[rgba(20,20,20,0.9)] px-6 sm:px-9 py-5 sm:py-6 rounded-[18px] border border-white/[0.15] backdrop-blur-[10px] text-center w-[min(300px,90vw)] shadow-[0_0_25px_rgba(0,255,255,0.15)]">
            <h2 class="text-base sm:text-lg mb-5 sm:mb-6 text-[#eee]">آیا از ریست کردن امتیازها مطمئن هستید؟</h2>

            <div class="flex justify-center gap-3 sm:gap-4">
                <button id="btn-restart-score" class="px-4 sm:px-5 py-1.5 sm:py-2 rounded-[10px] border-none cursor-pointer text-sm sm:text-[0.95rem] transition-all duration-200 bg-[#ff4444] text-black shadow-[0_0_10px_#ff4444] hover:bg-[#ff2222] hover:shadow-[0_0_15px_#ff2222]">بله</button>
                <button id="close-reset-modal" class="px-4 sm:px-5 py-1.5 sm:py-2 rounded-[10px] border border-white/20 cursor-pointer text-sm sm:text-[0.95rem] transition-all duration-200 bg-white/10 text-[#ddd] hover:bg-white/20">خیر</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
